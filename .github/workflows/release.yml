name: Release

# Publica el .deb en GitHub Releases (lo usa la autoactualización) y las imágenes PHP en GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_GITHUB_CLIENT_ID: ${{ vars.DEVHUB_GITHUB_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ vars.DEVHUB_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.DEVHUB_GOOGLE_CLIENT_SECRET }}

  php-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/devhub-php:${{ matrix.php }}
          docker build --build-arg PHP_VERSION=${{ matrix.php }} -t "$IMAGE" images/php
          docker push "$IMAGE"
