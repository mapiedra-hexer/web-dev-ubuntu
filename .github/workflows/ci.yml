name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  php-images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg PHP_VERSION=${{ matrix.php }} -t devhub/php:${{ matrix.php }} images/php
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh devhub/php:${{ matrix.php }} -c 'php -v && php -m | grep -E "^(mysqli|gd|intl|zip)$" | wc -l | grep -q 4 && wp --version --allow-root'
