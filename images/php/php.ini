memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_vars = 10000
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = Europe/Madrid
sendmail_path = "/usr/bin/msmtp -t"
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
