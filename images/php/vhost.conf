<VirtualHost *:80>
    ServerName localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # Traefik termina TLS: el sitio debe saber que se sirve por HTTPS.
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    RemoteIPHeader X-Forwarded-For

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy de media: si un fichero subido no existe en local, se pide a producción.
    RewriteEngine On
    RewriteCond "${PROD_URL}" "!^$"
    RewriteCond %{REQUEST_URI} ^/(wp-content/uploads|img)/
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteRule ^/(.*)$ ${PROD_URL}/$1 [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
